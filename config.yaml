# Flood-AI prototype configuration.
# Historical replay only. This is not a live satellite feed.

product:
  name: SobekAI
  subtitle: Satellite-Powered Flood Intelligence & Early Warning
  version: 0.1.0-demo
  package: flood_ai

project:
  name: sobekai
  hazard: flood
  mode: historical_replay
  data_mode: sample          # sample | real  (real data is not downloaded yet)
  disclaimer: >
    Historical public-data replay. Predictions are simulated from archived
    satellite-derived products, not a live satellite downlink.

region:
  id: kosi_bihar
  name: Kosi River Basin
  country: India
  state: Bihar
  admin: Bihar
  river: Kosi / Koshi
  # Viewing frame for the Kosi fan in northern Bihar, anchored on the Koshi
  # Barrage. Not a Global Flood Database flood polygon.
  bbox:
    min_lon: 86.20
    min_lat: 25.20
    max_lon: 87.60
    max_lat: 26.70
  center:
    lon: 86.9269
    lat: 26.5263
  anchor:
    name: Koshi Barrage
    lon: 86.9269
    lat: 26.5263
    source: https://en.wikipedia.org/wiki/Koshi_Barrage
  crs: EPSG:4326
  bbox_note: >
    Approximate viewing frame around the Koshi Barrage (26.5263 N, 86.9269 E)
    and the northern Bihar districts named in public accounts of the 2008
    flood. This is not an ingested flood extent.

event:
  id: kosi_bihar_2008
  name: Kosi / Koshi Flood
  country: India
  state: Bihar
  region: Kosi River Basin
  river: Kosi / Koshi
  year: 2008
  official_source: Global Flood Database
  official_url: https://developers.google.com/earth-engine/datasets/catalog/GLOBAL_FLOOD_DB_MODIS_EVENTS_V1
  peak_start: "2008-08-18"
  peak_end: null
  status_label: Historical event
  date_note: >
    The embankment breach is dated 18 August 2008 in public accounts
    (GFDRR; Wikipedia summary of the event). The Global Flood Database
    event start and end dates have not been retrieved. No end date is shown.
  notes: >
    Active demonstration event. August 2008 Kosi embankment-collapse flood
    in northern Bihar. Flood-extent raster is not ingested.
  supporting_sources:
    - name: Tellman et al. 2021, Nature
      url: https://doi.org/10.1038/s41586-021-03695-w
    - name: GFDRR note on the 18 August 2008 Kosi embankment breach
      url: https://www.gfdrr.org/en/india-2008-needs-assessment-undertaken-after-kosi-floods-bihar-affected-33-million-people

archived_events:
  - id: emsr517_aoi15
    name: July 2021 Western Germany floods
    region: Ahr Valley, Germany
    official_source: Copernicus EMS Rapid Mapping EMSR517
    official_url: https://mapping.emergency.copernicus.eu/activations/EMSR517/
    status: archived
    note: >
      Not the active demonstration. Extent vectors are not loaded.
      Synthetic sample scores from that valley are not shown.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  samples_dir: data/samples
  models_dir: models
  output_dir: data/processed

grid:
  resolution_m: 250
  sample_rows: 48
  sample_cols: 64

temporal:
  feature_start: null
  feature_end: null
  prediction_date: null
  validation_date: null
  sample_days: 7          # isolated synthetic generator only; not shown as the Kosi timeline
  split:
    strategy: event_holdout
    train: "Do not train on the Kosi flood-extent map that will be used for validation."
    validation: "Not configured. Do not add other Indian events until a real dataset is ingested."
    test: "Kosi / Bihar 2008 Global Flood Database extent vs a pre-event SobekAI risk map. Neither is ingested."

datasets:
  precipitation:
    name: CHIRPS v3.0 daily SAT
    official_source: UCSB Climate Hazards Center
    url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/sat/2008/
    info_url: https://www.chc.ucsb.edu/data/chirps3
    satellite_inputs: Thermal infrared + NASA IMERG Late V07 daily disaggregation
    spatial_resolution: 0.05 deg (~5 km)
    temporal_resolution: daily
    lag:
      final_product: "Typically available the third week of the following month."
      prelim_product: "About 2 days after each pentad (2nd, 7th, 12th, 17th, 22nd, 27th)."
      prototype_note: >
        This replay uses the archived final SAT product as a stand-in.
        A live system would use CHIRPS prelim or IMERG Late (~4-14 hour to 2-day lag).
  dem:
    name: Copernicus DEM GLO-30
    official_source: Copernicus Programme / AWS Open Data
    url: https://registry.opendata.aws/copernicus-dem/
    satellite_inputs: Radar-derived digital surface model
    spatial_resolution: 30 m
    temporal_resolution: static
    lag: "Static terrain layer. No revisit. Acquired as a multi-year mosaic."
    backup:
      name: NASA SRTM GL1 V003
      url: https://doi.org/10.5067/MEASURES/SRTM/SRTMGL1.003
      spatial_resolution: 1 arc-second (~30 m)
  ground_truth:
    name: Global Flood Database MODIS flood extent
    official_source: Cloud to Street and Dartmouth Flood Observatory
    url: https://developers.google.com/earth-engine/datasets/catalog/GLOBAL_FLOOD_DB_MODIS_EVENTS_V1
    product: flooded and duration bands for one DFO event
    satellite: Terra and Aqua MODIS
    spatial_resolution: 250 m
    used_as: validation_only
    status: not_ingested
    note: >
      Preferred historical flood-extent source for this event.
      The specific Kosi/Bihar raster and DFO event id have not been retrieved.
  optional_later:
    sentinel1:
      name: Sentinel-1 GRD IW VV/VH
      url: https://dataspace.copernicus.eu/
      spatial_resolution: 10 m
      role: "Not used for the 2008 event. Sentinel-1 was not operating in August 2008."

features:
  enabled:
    - precip_1d
    - precip_3d
    - precip_7d
    - elevation
    - slope
    - hand
    - dist_to_river
  excluded_for_v1:
    - ndwi
    - ndvi
    - ndbi
    - sentinel1_backscatter
  reason: >
    Pre-event flood risk for this valley flood is driven by accumulating rainfall
    and topographic exposure. Optical indices are often cloudy during the storm
    and are better at detecting water after it is already there.

model:
  type: expert_weighted
  trained: false
  algorithm: "Transparent weighted score. Random Forest / LightGBM is Phase 2+."
  weights:
    precip_3d: 0.35
    precip_7d: 0.15
    hand: 0.25
    slope: 0.10
    dist_to_river: 0.15
  scaling:
    precip_3d_mm: 80.0
    precip_7d_mm: 150.0
    hand_m: 40.0
    slope_deg: 15.0
    dist_to_river_m: 3000.0

risk_thresholds:
  low: 0.25
  moderate: 0.50
  high: 0.75
  critical: 0.90

alerts:
  high_risk_label: HIGH
  compare_with_actual: true

sample:
  seed: 42
  labeled: SYNTHETIC SAMPLE DATA
  analog_peak_day_index: 6

# Published IBM/NASA flood segmenter. It maps water on Sentinel-2.
# It is not an earthquake model and it is not a pre-event risk forecast.
prithvi:
  enabled: true
  model_id: ibm-nasa-geospatial/Prithvi-EO-2.0-300M-TL-Sen1Floods11
  backbone: prithvi_eo_v2_300_tl
  role: event_flood_extent
  url: https://huggingface.co/ibm-nasa-geospatial/Prithvi-EO-2.0-300M-TL-Sen1Floods11
  bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    - SWIR_1
    - SWIR_2
  s2l1c_band_indices: [1, 2, 3, 8, 11, 12]
  num_classes: 2
  flood_class: 1
  tile_size: 512
  weights_dir: models/prithvi
  checkpoint: Prithvi-EO-V2-300M-TL-Sen1Floods11.pt
  model_config: config.yaml
  scene: null
  notes: >
    Used to detect flood water on a Sentinel-2 scene from the historical
    event (during/after the flood). The early-warning score stays separate.
