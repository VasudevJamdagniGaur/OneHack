<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SobekAI · History</title>
  <link rel="icon" type="image/png" href="/assets/sobek-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/sobek.css">
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline poster="/assets/sobek-bg-poster.jpg" aria-hidden="true">
    <source src="/assets/sobek-bg.mp4" type="video/mp4">
  </video>
  <script src="/assets/sobek-bg.js"></script>
  <div class="bg-shade" aria-hidden="true"></div>
  <div id="app" class="boot"><img class="logo" src="/assets/sobek-logo.png" alt="SobekAI"><p>Loading flood intelligence…</p></div>
  <template id="page-template">
    <main class="page">
      <p class="eyebrow">Historical validation</p>
      <h1>Flood History</h1>
      <p class="lede">Five Indian historical scenarios. Opening one starts a simulator replay, not a live feed.</p>
      <section class="grid cards" id="events"></section>
      <section class="panel" id="event-detail" style="margin-top:16px">
        <h2>Prediction vs actual</h2>
        <div class="split" id="prediction-vs-actual">
          <div class="empty">SobekAI predicted risk: awaiting model data.</div>
          <div class="empty">Actual Kosi flood extent: historical flood extent ingestion pending.</div>
        </div>
        <p id="metrics"></p>
      </section>
      <section class="panel" id="event-sources" style="margin-top:16px"></section>
      <section class="panel" style="margin-top:14px">
        <h2>Analytics</h2>
        <p>Risk vs time, rainfall vs time, flooded area vs time, and model performance will consume API series. No chart values are hardcoded here.</p>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>
  </template>
  <script src="/assets/sobek.js"></script>
  <script>SobekAI.boot("history");</script>
</body>
</html>
