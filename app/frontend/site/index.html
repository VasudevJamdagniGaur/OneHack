<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SobekAI · Dashboard</title>
  <link rel="icon" type="image/png" href="/assets/sobek-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/assets/sobek.css">
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline poster="/assets/sobek-bg-poster.jpg" aria-hidden="true">
    <source src="/assets/sobek-bg.mp4" type="video/mp4">
  </video>
  <script src="/assets/sobek-bg.js"></script>
  <div class="bg-shade" aria-hidden="true"></div>
  <div id="app" class="boot"><img class="logo" src="/assets/sobek-logo.png" alt="SobekAI"><p>Loading flood intelligence…</p></div>
  <template id="page-template">
    <main class="page">
      <p class="eyebrow">Satellite-powered flood intelligence</p>
      <h1>Flood <em>Intelligence</em></h1>
      <p class="lede">Watch the waters. Understand the risk. Stay ahead of the surge.</p>
      <section class="kpis" id="kpis"></section>
      <section class="dash">
        <section class="panel map-panel">
          <div class="panel-head">
            <h2>Flood risk map</h2>
            <div class="map-tools">
              <details class="layer-drop">
                <summary>Predicted risk</summary>
                <div class="layer-menu" id="layers"></div>
              </details>
              <button class="icon-btn" id="map-full" type="button" aria-label="Fullscreen map">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg>
              </button>
            </div>
          </div>
          <div class="map-frame"><div id="map"></div></div>
          <div class="legend">
            <span><i class="swatch" style="background:var(--risk-low)"></i>Low</span>
            <span><i class="swatch" style="background:var(--risk-moderate)"></i>Moderate</span>
            <span><i class="swatch" style="background:var(--risk-high)"></i>High</span>
            <span><i class="swatch" style="background:var(--risk-critical)"></i>Critical</span>
          </div>
        </section>
        <aside class="rail">
          <section class="panel" id="event-card"></section>
          <section class="panel" id="distribution"></section>
          <section class="panel" id="inspect"></section>
        </aside>
      </section>
      <section class="lower">
        <section class="panel" id="timeline"></section>
        <section class="panel" id="source-card"></section>
        <section class="panel" id="engine-card"></section>
      </section>
    </main>
  </template>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/sobek.js"></script>
  <script>SobekAI.boot("dashboard");</script>
</body>
</html>
