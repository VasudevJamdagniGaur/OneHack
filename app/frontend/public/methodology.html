      <h1>Data &amp; Methodology</h1>
      <p class="lede">See how satellite observations become flood-risk intelligence.</p>
      <section class="panel" id="sources"></section>

      <section class="panel" style="margin-top:14px">
        <h2>Two modes</h2>
        <p>Live Monitor shows the current or manually selected place. It does not invent rainfall, warnings, shelters, or a risk score when those feeds are not connected.</p>
        <p>Scenario Simulator replays a configured historical event. The five initial events are Kosi 2008, Assam 2022, Maharashtra 2021, Sikkim / Teesta 2023, and Kerala / Wayanad 2024. Kosi 2008 is the default. A replay is not a live feed.</p>
        <h2>Pipeline</h2>
        <div class="flow">
          <span>Satellite observations</span>+<span>Environmental signals</span>+<span>Terrain</span>+<span>Temporal information</span>→<span>Flood-risk model</span>→<span>Spatial risk score</span>→<span>Risk map</span>→<span>Early warning</span>
        </div>
        <p>Flood segmentation identifies observed water or flood extent. SobekAI’s risk layer turns spatial and environmental signals into a risk estimate. Those are different products. Segmentation is the third-party IBM/NASA Prithvi-EO model. It has not been run on these historical events. The risk engine is an untrained expert-weighted baseline and has no grid for these events yet.</p>
        <p>SobekAI cannot guarantee a flood, replace civil protection, or update a map without a new observation.</p>
        <h2>Assam 2022</h2>
        <p>This scenario uses archived material and is not a live satellite feed. Sentinel-1, rainfall, DEM, and a georeferenced flood-extent raster are not connected. The maps supplied for Barkandoli, Hojai, Jhargaon, Kampur, Kanakpur, Pailapool, Silchar, Sivasagar, Jiribam, and Imphal are visual references. They are not raw satellite products and they are not a SobekAI risk grid.</p>
